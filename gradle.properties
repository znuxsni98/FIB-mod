org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true

# ForgeGradle 加载插件时会对 maven.minecraftforge.net 做一次 TLS 预检（EnvironmentChecks.testServerConnection）。
# 本机 DNS 对该域名存在污染，解析结果前两个 IPv4（141.193.154.70 / .210）是劫持服务器，
# 其证书不含该域名 → Java 域名校验失败且不会回退到后面的正确地址 → 插件加载直接报
# "Failed to validate certificate for host 'https://maven.minecraftforge.net/'"。
# 关闭的只是这次预检；真正下载依赖时仍由 Gradle 自己校验证书，不受影响。
systemProp.net.minecraftforge.gradle.check.certs=false

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)

forge_version=47.4.20
forge_version_range=[47,)
loader_version_range=[47,)


create_version = 6.0.8-289
ponder_version = 1.0.91
flywheel_version = 1.0.5
registrate_version = MC1.20-1.3.3

geckolib_version=4.8.4


